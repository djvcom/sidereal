[workspace]
members = [
    "crates/sidereal",
    "crates/sidereal-ai",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/djvcom/sidereal"
rust-version = "1.95"

# =============================================================================
# Lint configuration (inherited by all crates via [lints] workspace = true)
# =============================================================================

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
